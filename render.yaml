services:
  - type: web
    name: hiv-risk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    # Long timeout: the first Luganda voice request for a sentence can take up to ~90s.
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    healthCheckPath: /api/form-options/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SUNBIRD_API_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
